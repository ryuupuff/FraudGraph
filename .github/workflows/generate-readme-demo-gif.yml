name: Generate README demo GIF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Build lightweight animated demo from the project screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path("docs/screenshots")
          names = [
              "overview-dashboard.png",
              "transaction-activity-timeline.png",
              "transaction-dossier.png",
              "graph-explorer-seed.png",
              "graph-explorer-expanded.png",
          ]

          frames = []
          for name in names:
              path = root / name
              if not path.exists():
                  raise FileNotFoundError(f"Required README screenshot is missing: {path}")
              with Image.open(path) as source:
                  frame = ImageOps.fit(source.convert("RGB"), (480, 270), method=Image.Resampling.LANCZOS)
                  frames.append(frame.quantize(colors=48, method=Image.Quantize.MEDIANCUT))

          output = root / "fraudgraph-showcase.gif"
          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=1300,
              loop=0,
              optimize=True,
              disposal=2,
          )
          print(f"Created {output} ({output.stat().st_size:,} bytes)")
          PY

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/fraudgraph-showcase.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs: add animated FraudGraph README demo"
            git push
          else
            echo "The README GIF is already up to date."
          fi
